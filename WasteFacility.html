<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/all/all.min.css" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --background: #171717;
            --sidebar: #181818;
            --border: #2b2b2b;
            --muted: #a0a0a0;
            --text: #f5f5f5;
            --accent: #1f6200;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
        }

        body {
            background: var(--background);
            color: var(--text);
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .app-shell {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            width: 178px;
            min-height: 100vh;
            padding: 31px 12px 57px;
            border-right: 1px solid var(--border);
            background: var(--sidebar);
        }

        .brand {
            margin: 0 0 27px;
            color: var(--text);
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 1.1px;
            line-height: 21px;
            text-align: center;
        }

        .navigation {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .nav-link {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            min-height: 32px;
            padding: 8px 10px;
            border-radius: 4px;
            color: var(--muted);
            font-size: 11px;
            line-height: 15px;
            text-decoration: none;
            transition: background-color 150ms ease, color 150ms ease;
        }

        .nav-link:hover,
        .nav-link:focus-visible {
            color: var(--text);
            outline: none;
            background-color: #26740932;
        }

        .nav-link.active {
            background: var(--accent);
            color: #fff;
        }

        .nav-icon {
            flex: 0 0 14px;
            width: 14px;
            color: currentColor;
            font-size: 15px;
            line-height: 14px;
            text-align: center;
        }

        .logout {
            margin-top: auto;
        }

        .main-content {
            flex: 1;
            padding: 34px 48px;
        }

        .page-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1.6px;
        }

        .leaf {
            color: #65ee28;
            font-size: 23px;
            line-height: 1;
        }
        hr {
            color: var(--border);
            border: 1px solid;
        }
        i {
            color: var(--text);
            font-size: 15px;
        }

        @media (max-width: 640px) {
            .app-shell {
                display: block;
            }

            .sidebar {
                width: 100%;
                min-height: auto;
                padding: 20px 12px;
            }

            .brand {
                margin-bottom: 18px;
            }

            .navigation {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .logout {
                margin-top: 12px;
            }

            .main-content {
                padding: 28px 24px;
            }
        }
    </style>
    <title>Waste Management</title>
 
</head>
<body>

    {{NAVBAR}}

<div class="main-content">
    <h2 class="page-title"><span class="leaf" aria-hidden="true">🪴</span> DASHBOARD</h2><hr>
            
</div>

</div>

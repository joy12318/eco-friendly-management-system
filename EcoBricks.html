
<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <style>
    /* Main page design */
    body {
      margin: 0;
      padding: 25px;
      font-family: Arial, sans-serif;
      background-color: #111111;
      color: white;
    }

    h1 {
      margin-bottom: 5px;
    }

    p {
      color: #cccccc;
    }

    /* White form and table containers */
    .container {
      background-color: #ffffff;
      color: #222222;
      padding: 25px;
      margin-top: 25px;
      border-radius: 10px;
    }

    /* Summary cards */
    .summary {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }

    .card {
      background-color: #222222;
      color: white;
      padding: 20px;
      border-radius: 8px;
      flex: 1;
    }

    .card h2 {
      color: #4caf50;
      margin: 0;
    }

    .card p {
      margin-bottom: 0;
    }

    /* Form layout */
    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #cccccc;
      border-radius: 5px;
      font-size: 15px;
    }

    /* Green buttons */
    button {
      background-color: #2e7d32;
      color: white;
      border: none;
      padding: 10px 15px;
      margin-top: 15px;
      margin-right: 5px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1b5e20;
    }

    /* Records table */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 12px;
      border: 1px solid #dddddd;
      text-align: left;
    }

    th {
      background-color: #222222;
      color: white;
    }

    .status {
      color: #2e7d32;
      font-weight: bold;
    }

    /* Search box */
    #searchInput {
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <!-- Navigation bar generated by Code.gs -->
  <!-- NAV BAR (GENERATED BY Code.gs) -->

  <h1>Eco Bricks Management</h1>
  <p>Record and manage received and used eco-bricks.</p>

  <!-- Summary section: displays the total counts -->
  <div class="summary">

    <div class="card">
      <h2 id="totalRecords">0</h2>
      <p>Total Records</p>
    </div>

    <div class="card">
      <h2 id="totalQuantity">0</h2>
      <p>Total Eco Bricks</p>
    </div>

    <div class="card">
      <h2 id="totalCollected">0</h2>
      <p>Collected Records</p>
    </div>

  </div>

  <!-- Form section: add a new eco-brick record -->
  <div class="container">

    <h2 id="formTitle">Add Eco Brick</h2>

    <form id="ecoBrickForm">

      <label for="brickId">Eco Brick ID</label>
      <input
        type="text"
        id="brickId"
        placeholder="Example: EB001"
        required
      >

      <label for="contributor">Contributor Name</label>
      <input
        type="text"
        id="contributor"
        placeholder="Name of the person who submitted it"
        required
      >

      <label for="quantity">Quantity</label>
      <input
        type="number"
        id="quantity"
        min="1"
        placeholder="Example: 10"
        required
      >

      <label for="dateReceived">Date Received</label>
      <input type="date" id="dateReceived" required>

      <label for="status">Status</label>
      <select id="status" required>
        <option value="Collected">Collected</option>
        <option value="Used">Used</option>
      </select>

      <button type="submit" id="saveButton">Save Eco Brick</button>
      <button type="button" onclick="resetForm()">Clear Form</button>

    </form>

  </div>

  <!-- Table section: displays all eco-brick records -->
  <div class="container">

    <h2>Eco Bricks Records</h2>

    <label for="searchInput">Search Records</label>
    <input
      type="text"
      id="searchInput"
      placeholder="Search by ID or contributor name"
      oninput="displayRecords()"
    >

    <table>
      <thead>
        <tr>
          <th>Eco Brick ID</th>
          <th>Contributor</th>
          <th>Quantity</th>
          <th>Date Received</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="recordsTable">
        <!-- JavaScript will insert records here -->
      </tbody>
    </table>

  </div>

  <script>
    /*
      TEMPORARY STORAGE:
      Records are stored in this array.
      They will disappear when the page is refreshed.
    */
    let ecoBricks = [];
    let editingIndex = -1;

    // Handle the Save Eco Brick button
    document.getElementById("ecoBrickForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        // Get the values from the form
        const brickId = document.getElementById("brickId").value.trim();
        const contributor = document.getElementById("contributor").value.trim();
        const quantity = Number(document.getElementById("quantity").value);
        const dateReceived = document.getElementById("dateReceived").value;
        const status = document.getElementById("status").value;

        // Make sure the quantity is at least 1
        if (quantity < 1) {
          alert("Quantity must be at least 1.");
          return;
        }

        // Prevent duplicate IDs
        const duplicate = ecoBricks.some(function(brick, index) {
          return brick.brickId.toLowerCase() === brickId.toLowerCase()
            && index !== editingIndex;
        });

        if (duplicate) {
          alert("This Eco Brick ID already exists.");
          return;
        }

        // Create a new eco-brick record
        const brick = {
          brickId: brickId,
          contributor: contributor,
          quantity: quantity,
          dateReceived: dateReceived,
          status: status
        };

        // Update an existing record or add a new one
        if (editingIndex >= 0) {
          ecoBricks[editingIndex] = brick;
          alert("Eco Brick record updated!");
        } else {
          ecoBricks.push(brick);
          alert("Eco Brick record added!");
        }

        resetForm();
        displayRecords();
      });

    // Display the records in the table
    function displayRecords() {
      const table = document.getElementById("recordsTable");
      const search = document.getElementById("searchInput")
        .value.toLowerCase();

      table.innerHTML = "";

      ecoBricks.forEach(function(brick, index) {

        // Search by Eco Brick ID or contributor name
        const matchesSearch =
          brick.brickId.toLowerCase().includes(search) ||
          brick.contributor.toLowerCase().includes(search);

        if (!matchesSearch) {
          return;
        }

        const row = table.insertRow();

        row.insertCell().textContent = brick.brickId;
        row.insertCell().textContent = brick.contributor;
        row.insertCell().textContent = brick.quantity;
        row.insertCell().textContent = brick.dateReceived;

        const statusCell = row.insertCell();
        statusCell.textContent = brick.status;
        statusCell.className = "status";

        const actionsCell = row.insertCell();

        // Create the Edit button
        const editButton = document.createElement("button");
        editButton.textContent = "Edit";
        editButton.onclick = function() {
          editRecord(index);
        };
        actionsCell.appendChild(editButton);

        // Create the Delete button
        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.onclick = function() {
          deleteRecord(index);
        };
        actionsCell.appendChild(deleteButton);
      });

      updateSummary();
    }

    // Update the numbers displayed in the summary cards
    function updateSummary() {
      document.getElementById("totalRecords").textContent =
        ecoBricks.length;

      const total = ecoBricks.reduce(function(sum, brick) {
        return sum + brick.quantity;
      }, 0);

      document.getElementById("totalQuantity").textContent = total;

      const collected = ecoBricks.filter(function(brick) {
        return brick.status === "Collected";
      }).length;

      document.getElementById("totalCollected").textContent = collected;
    }

    // Load the selected record into the form for editing
    function editRecord(index) {
      const brick = ecoBricks[index];

      document.getElementById("brickId").value = brick.brickId;
      document.getElementById("contributor").value = brick.contributor;
      document.getElementById("quantity").value = brick.quantity;
      document.getElementById("dateReceived").value = brick.dateReceived;
      document.getElementById("status").value = brick.status;

      editingIndex = index;

      document.getElementById("formTitle").textContent = "Edit Eco Brick";
      document.getElementById("saveButton").textContent = "Update Eco Brick";

      document.getElementById("ecoBrickForm").scrollIntoView();
    }

    // Delete a record from the list
    function deleteRecord(index) {
      const confirmDelete = confirm(
        "Are you sure you want to delete this record?"
      );

      if (confirmDelete) {
        ecoBricks.splice(index, 1);
        displayRecords();
        alert("Eco Brick record deleted.");
      }
    }

    // Clear the form and reset it to Add mode
    function resetForm() {
      document.getElementById("ecoBrickForm").reset();

      editingIndex = -1;

      document.getElementById("formTitle").textContent = "Add Eco Brick";
      document.getElementById("saveButton").textContent = "Save Eco Brick";
    }

    // Display the empty table and zero totals when the page loads
    displayRecords();
  </script>

</body>
</html>
